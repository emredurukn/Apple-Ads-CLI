version: 2

project_name: asactl

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    main: ./main.go
    binary: asactl
    ldflags:
      - -s -w
      - -X github.com/emredurukn/asactl/internal/version.Version={{.Version}}
      - -X github.com/emredurukn/asactl/internal/version.GitCommit={{.Commit}}
      - -X github.com/emredurukn/asactl/internal/version.BuildDate={{.Date}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

