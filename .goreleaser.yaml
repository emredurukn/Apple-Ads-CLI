version: 2

project_name: asactl

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    main: ./main.go
    binary: asactl
    ldflags:
      - -s -w
      - -X github.com/emredurukn/asactl/internal/version.Version={{.Version}}
      - -X github.com/emredurukn/asactl/internal/version.GitCommit={{.Commit}}
      - -X github.com/emredurukn/asactl/internal/version.BuildDate={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

brews:
  - repository:
      owner: emredurukn
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/emredurukn/Apple-Ads-CLI"
    description: "Fast, scriptable CLI for the Apple Search Ads API"
    license: "MIT"
    folder: Formula
    test: |
      system "#{bin}/asactl", "version"
